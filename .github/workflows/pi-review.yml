# On-demand review of an in-flight (WIP/draft) PR, run by Pi
# (@earendil-works/pi-coding-agent) executing the project's own review
# skill (.pi/skills/review/SKILL.md). Two ways to invoke:
#
#   1. Comment "/review" anywhere on the PR.
#   2. gh workflow run pi-review.yml -f pr=<number>
#      (or the Run workflow button in the Actions tab).
#
# Requires the MINIMAX_API_KEY repo secret (default provider). To use a
# different provider/model, set the PI_REVIEW_PROVIDER / PI_REVIEW_MODEL
# repo variables and add that provider's key as a secret below.

name: Pi review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: pi-review-${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.issue.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.issue.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: the review diffs against the merge-base with main.
          fetch-depth: 0

      - name: Check out the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR number must be numeric, got: $PR_NUMBER" >&2
            exit 1
          fi
          gh pr checkout "$PR_NUMBER"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Run the two-axis review
        env:
          GH_TOKEN: ${{ github.token }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PI_PROVIDER: ${{ vars.PI_REVIEW_PROVIDER || 'minimax' }}
          PI_MODEL: ${{ vars.PI_REVIEW_MODEL || 'MiniMax-M3' }}
        # --approve trusts the checked-out repo's project-local files so Pi
        # loads .pi/skills/; --exclude-tools keeps the run read-and-comment
        # only. The prompt only interpolates values validated or provided by
        # the runner (numeric PR number, GITHUB_REPOSITORY).
        run: |
          pi --provider "$PI_PROVIDER" --model "$PI_MODEL" --thinking high \
             --print --no-session --approve --exclude-tools edit,write \
             "REPO: $GITHUB_REPOSITORY
          PR NUMBER: $PR_NUMBER

          You are reviewing an in-flight (possibly draft) PR in CI. The PR
          branch is already checked out; the gh CLI is authenticated.

          Read .pi/skills/review/SKILL.md and execute that review process
          against this PR, with these bindings:

          - The fixed point is the branch's merge-base with origin/main —
            do not ask.
          - The PR body carries the slice-brief; treat it as the spec
            (gh pr view $PR_NUMBER --json body). If the body is empty, fall
            back to the skill's spec-discovery order and note the gap in
            the report.
          - No sub-agent tool exists in this environment: run the Standards
            and Spec axes sequentially per the skill's fallback, and note
            in the report that both axes shared one context.
          - Deliver the report as ONE top-level PR comment
            (gh pr comment $PR_NUMBER --body-file <file>), following the
            skill's report format. Cite findings as file:line. Do not
            modify the branch or push anything.

          This is a WIP review — the goal is early course correction, not a
          merge gate. Rank findings by how expensive they become if the
          branch continues building on them."

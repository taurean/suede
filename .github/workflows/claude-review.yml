# On-demand review of an in-flight (WIP/draft) PR, driven by the project's
# own review skill (.pi/skills/review/SKILL.md). Two ways to invoke:
#
#   1. Comment "/review" anywhere on the PR.
#   2. gh workflow run claude-review.yml -f pr=<number>
#      (or the Run workflow button in the Actions tab).
#
# Requires the ANTHROPIC_API_KEY repo secret (or swap in
# claude_code_oauth_token — see anthropics/claude-code-action docs).

name: Claude review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: claude-review-${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.issue.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.issue.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: the review diffs against the merge-base with main.
          fetch-depth: 0

      - name: Check out the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR number must be numeric, got: $PR_NUMBER" >&2
            exit 1
          fi
          gh pr checkout "$PR_NUMBER"

      - name: Run the two-axis review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            You are reviewing an in-flight (possibly draft) PR. The PR branch
            is already checked out.

            Read .pi/skills/review/SKILL.md and execute that review process
            against this PR, with these bindings:

            - The fixed point is the branch's merge-base with origin/main —
              do not ask.
            - The PR body carries the slice-brief; treat it as the spec. If
              the body is empty, fall back to the skill's spec-discovery
              order and note the gap in the report.
            - Run the Standards and Spec axes per the skill: parallel
              sub-agents if your Agent tool is available, sequentially with
              the noted caveat if not.
            - Deliver the report as one top-level PR comment in the skill's
              report format, plus inline comments for findings anchored to a
              specific line. Do not push commits or modify the branch.

            This is a WIP review — the goal is early course correction, not
            a merge gate. Rank findings by how expensive they become if the
            branch continues building on them.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git merge-base:*),Bash(git fetch:*)"
